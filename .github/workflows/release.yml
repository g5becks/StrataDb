name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref }}
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: "1.4.4"
      # Node 24 includes an npm CLI supporting trusted publishing (>=11.5.1).
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Verify tag matches package version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(bun -p 'require("./package.json").version')
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "::error::Tag $RELEASE_TAG does not match package version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test --coverage
      - run: bun run build
      - run: bun run test:types
      - run: bun run test:consumer
      - name: Check whether version is already published
        id: registry
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          result="$RUNNER_TEMP/stratadb-registry.json"
          if npm view "stratadb@$RELEASE_VERSION" version --json > "$result"; then
            bun -e 'if (JSON.parse(await Bun.file(process.argv[1]).text()) !== process.env.RELEASE_VERSION) process.exit(1)' "$result"
            echo "::notice::stratadb@$RELEASE_VERSION is already on npm; skipping publication"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            # Only a missing version permits publication; registry/network errors fail.
            bun -e 'if (JSON.parse(await Bun.file(process.argv[1]).text()).error?.code !== "E404") process.exit(1)' "$result"
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Pack and publish with OIDC and provenance
        if: steps.registry.outputs.published == 'false'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          tarball="stratadb-$RELEASE_VERSION.tgz"
          bun pm pack --filename "$tarball"
          npm publish "./$tarball" --provenance --access public
