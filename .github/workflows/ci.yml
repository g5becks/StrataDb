name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        bun: ["1.4.4", latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: ${{ matrix.bun }}
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test --coverage
      - run: bun run build
      - run: bun run test:types

  typescript:
    strategy:
      fail-fast: false
      matrix:
        include:
          - typescript: "5.9.3"
            experimental: false
          - typescript: "6.0.3"
            experimental: false
          - typescript: "7.0.2"
            experimental: false
          - typescript: "7.1.0-beta"
            experimental: true
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - run: bunx -p typescript@${{ matrix.typescript }} tsc --noEmit
      - run: bunx -p typescript@${{ matrix.typescript }} tsc --noEmit -p test/type/tsconfig.json
