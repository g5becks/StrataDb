name: Nightly query properties

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  differential:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - name: Run differential suite with a printed random seed
        env:
          STRATADB_PROPERTY_RANDOM: "1"
        run: bun test test/property/query-differential.test.ts
